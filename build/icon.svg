<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d36"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc466"/>
      <stop offset="1" stop-color="#e88a1a"/>
    </linearGradient>
    <linearGradient id="mint" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe6c8"/>
      <stop offset="1" stop-color="#1fa885"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cableShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="12" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- macOS icon body: 824px rounded square centred in the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- socket rings: four jacks on the panel -->
  <g fill="#0c0d11" stroke="#4a4e5a" stroke-width="14">
    <circle cx="322" cy="322" r="78"/>
    <circle cx="702" cy="322" r="78"/>
    <circle cx="322" cy="702" r="78"/>
    <circle cx="702" cy="702" r="78"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6">
    <circle cx="322" cy="322" r="96"/>
    <circle cx="702" cy="322" r="96"/>
    <circle cx="322" cy="702" r="96"/>
    <circle cx="702" cy="702" r="96"/>
  </g>

  <!-- two patch cables crossing: the swap -->
  <g fill="none" stroke-linecap="round" filter="url(#cableShadow)">
    <path d="M322 322 C322 540, 702 484, 702 702" stroke="url(#mint)" stroke-width="58"/>
    <path d="M322 702 C322 484, 702 540, 702 322" stroke="url(#amber)" stroke-width="58"/>
    <!-- highlight on the amber cable so it reads as on top -->
    <path d="M322 702 C322 484, 702 540, 702 322" stroke="#ffffff" stroke-opacity="0.28" stroke-width="14" transform="translate(-8,-8)"/>
  </g>

  <!-- plugs seated in the sockets -->
  <g>
    <circle cx="322" cy="322" r="40" fill="#2ec39d"/>
    <circle cx="702" cy="702" r="40" fill="#2ec39d"/>
    <circle cx="322" cy="702" r="40" fill="#f4a531"/>
    <circle cx="702" cy="322" r="40" fill="#f4a531"/>
    <circle cx="322" cy="322" r="16" fill="#0c0d11"/>
    <circle cx="702" cy="702" r="16" fill="#0c0d11"/>
    <circle cx="322" cy="702" r="16" fill="#0c0d11"/>
    <circle cx="702" cy="322" r="16" fill="#0c0d11"/>
  </g>
</svg>
